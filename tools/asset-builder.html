<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Auto Asset Builder | ADE Layer 3</title>
    <meta name="description" content="Build new tool code and JSON entry in seconds.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f0f0f; color: #f1f5f9; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="p-4 max-w-lg mx-auto">
    <div class="flex items-center gap-2 mb-6">
        <a href="https://mobifactory.pages.dev" class="text-2xl text-gray-400">←</a>
        <h1 class="text-2xl font-bold tracking-tight text-teal-400">🏗️ Auto Asset Builder</h1>
    </div>
    <p class="text-zinc-400 text-sm mb-4">Generate the starter code and JSON entry for a new tool in one click.</p>

    <div class="space-y-3 mb-6">
        <div>
            <label class="block text-xs text-zinc-500 mb-1">Tool Name</label>
            <input id="toolName" placeholder="e.g. Time Tracker" class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white">
        </div>
        <div>
            <label class="block text-xs text-zinc-500 mb-1">Icon (emoji)</label>
            <input id="toolIcon" placeholder="e.g. ⏱️" class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white">
        </div>
        <div>
            <label class="block text-xs text-zinc-500 mb-1">Description</label>
            <input id="toolDesc" placeholder="e.g. Track your freelance hours" class="w-full p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-white">
        </div>
    </div>

    <button id="generateBtn" class="w-full bg-teal-700 hover:bg-teal-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg transition">
        🔨 Generate Assets
    </button>

    <div id="outputArea" class="mt-6 hidden space-y-4">
        <!-- HTML Preview -->
        <div>
            <p class="text-xs text-teal-400 mb-2">📄 HTML Starter Code (copy to tools/your-tool.html)</p>
            <textarea readonly id="htmlOutput" class="w-full h-40 p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-xs text-green-400 font-mono"></textarea>
            <button onclick="copyToClipboard('htmlOutput')" class="mt-2 bg-teal-700 text-white px-4 py-1 rounded-lg text-xs">📋 Copy HTML</button>
        </div>
        <!-- JSON Preview -->
        <div>
            <p class="text-xs text-teal-400 mb-2">📝 JSON Entry (add to tools.json)</p>
            <textarea readonly id="jsonOutput" class="w-full h-24 p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-xs text-green-400 font-mono"></textarea>
            <button onclick="copyToClipboard('jsonOutput')" class="mt-2 bg-teal-700 text-white px-4 py-1 rounded-lg text-xs">📋 Copy JSON</button>
        </div>
        <!-- SEO Preview -->
        <div>
            <p class="text-xs text-teal-400 mb-2">🔍 SEO Title & Meta</p>
            <textarea readonly id="seoOutput" class="w-full h-16 p-3 bg-zinc-900 border border-zinc-700 rounded-lg text-xs text-green-400 font-mono"></textarea>
            <button onclick="copyToClipboard('seoOutput')" class="mt-2 bg-teal-700 text-white px-4 py-1 rounded-lg text-xs">📋 Copy SEO</button>
        </div>
    </div>

    <script>
        function slugify(text) {
            return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        function buildHTML(name, icon, desc, slug) {
            var seoTitle = 'Free ' + name + ' (No Signup) | Embed Factory';
            var seoDesc = desc + '. Free, fast, and mobile-friendly.';
            var html = '<!DOCTYPE html>\n';
            html += '<html lang="en">\n<head>\n';
            html += '    <meta charset="UTF-8">\n';
            html += '    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">\n';
            html += '    <title>' + seoTitle + '</title>\n';
            html += '    <meta name="description" content="' + seoDesc + '">\n';
            html += '    <script src="https://cdn.tailwindcss.com"><\/script>\n';
            html += '    <style>\n';
            html += '        body { background: #0f0f0f; color: #f1f5f9; font-family: system-ui, sans-serif; }\n';
            html += '    </style>\n';
            html += '</head>\n<body class="p-4 max-w-lg mx-auto">\n';
            html += '    <div class="flex items-center gap-2 mb-6">\n';
            html += '        <a href="https://mobifactory.pages.dev" class="text-2xl text-gray-400">←</a>\n';
            html += '        <h1 class="text-2xl font-bold tracking-tight">' + icon + ' ' + name + '</h1>\n';
            html += '    </div>\n';
            html += '    <p class="text-zinc-400 text-sm mb-4">' + desc + '.</p>\n';
            html += '    <!-- Add your tool logic here -->\n';
            html += '    <div class="text-center text-zinc-500 text-sm mt-8">✨ Your tool content goes here.</div>\n';
            html += '    <div class="mt-6 p-3 bg-zinc-900 rounded-xl border border-zinc-800 text-center">\n';
            html += '        <p class="text-xs text-zinc-500 mb-2">Embed this tool on your site</p>\n';
            html += '        <textarea readonly class="w-full h-12 p-2 bg-black border border-zinc-700 rounded-lg text-xs text-green-400 font-mono mb-2">&lt;iframe src="https://mobifactory.pages.dev/tools/' + slug + '.html" width="100%" height="400" frameborder="0"&gt;&lt;/iframe&gt;</textarea>\n';
            html += '        <button onclick="navigator.clipboard.writeText(this.previousElementSibling.value);alert(\'Embed code copied!\')" class="bg-green-700 text-white px-4 py-1 rounded-lg text-xs font-bold">📋 Copy Embed Code</button>\n';
            html += '    </div>\n';
            html += '    <script src="/router.js"><\/script>\n';
            html += '</body>\n</html>';
            return html;
        }

        function buildJSON(name, slug, icon, desc) {
            var json = '  ,\n';
            json += '  {\n';
            json += '    "name": "' + name + '",\n';
            json += '    "file": "/tools/' + slug + '.html",\n';
            json += '    "icon": "' + icon + '",\n';
            json += '    "description": "' + desc + '",\n';
            json += '    "embedId": "' + slug + '"\n';
            json += '  }';
            return json;
        }

        document.getElementById('generateBtn').addEventListener('click', function() {
            var name = document.getElementById('toolName').value.trim();
            var icon = document.getElementById('toolIcon').value.trim() || '🛠️';
            var desc = document.getElementById('toolDesc').value.trim() || 'A useful micro tool';

            if (!name) {
                alert('Please enter a tool name.');
                return;
            }

            var slug = slugify(name);
            var seoTitle = 'Free ' + name + ' (No Signup) | Embed Factory';
            var seoDesc = desc + '. Free, fast, and mobile-friendly.';

            document.getElementById('htmlOutput').value = buildHTML(name, icon, desc, slug);
            document.getElementById('jsonOutput').value = buildJSON(name, slug, icon, desc);
            document.getElementById('seoOutput').value = '<title>' + seoTitle + '</title>\n<meta name="description" content="' + seoDesc + '">';

            document.getElementById('outputArea').classList.remove('hidden');
            document.getElementById('outputArea').scrollIntoView({behavior: 'smooth'});
        });

        function copyToClipboard(elementId) {
            var textarea = document.getElementById(elementId);
            textarea.select();
            textarea.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(textarea.value).then(function() {
                alert('Copied!');
            }).catch(function() {
                alert('Copy failed. Please select and copy manually.');
            });
        }
    </script>
</body>
</html>
